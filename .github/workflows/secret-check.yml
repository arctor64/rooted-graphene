# .github/workflows/secret-check.yaml in your fork
name: Secret sanity check
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      KEY_AVB_B64: ${{ secrets.KEY_AVB_BASE64 }}
      KEY_OTA_B64: ${{ secrets.KEY_OTA_BASE64 }}
      CERT_OTA_B64: ${{ secrets.CERT_OTA_BASE64 }}
      P_AVB: ${{ secrets.PASSPHRASE_AVB }}
      P_OTA: ${{ secrets.PASSPHRASE_OTA }}
    steps:
      - name: Length census
        run: |
          echo "KEY_AVB_BASE64:    $(printf %s "$KEY_AVB_B64"  | wc -c)"
          echo "KEY_OTA_BASE64:    $(printf %s "$KEY_OTA_B64"  | wc -c)"
          echo "CERT_OTA_BASE64:   $(printf %s "$CERT_OTA_B64" | wc -c)"
          echo "PASSPHRASE_AVB:    $(printf %s "$P_AVB"        | wc -c) (expect 32)"
          echo "PASSPHRASE_OTA:    $(printf %s "$P_OTA"        | wc -c) (expect 32)"
      - name: Decode check
        run: |
          printf %s "$KEY_AVB_B64"  | base64 -d | head -c 40; echo
          printf %s "$KEY_OTA_B64"  | base64 -d | head -c 40; echo
          printf %s "$CERT_OTA_B64" | base64 -d | head -c 40; echo
