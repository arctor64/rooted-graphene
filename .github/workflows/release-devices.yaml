# .github/workflows/release-devices.yaml
name: Release devices

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  panther:
    uses: ./.github/workflows/release-single.yaml
    secrets: inherit          # <-- the missing rite
    with:
      device-id: panther
      magisk-preinit-device: sda15
  shiba:
    uses: ./.github/workflows/release-single.yaml
    secrets: inherit
    with:
      device-id: shiba

